name: Test and publish report

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: superload-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: report/requirements.txt
      - name: Install report dependencies
        run: python3 -m pip install -r report/requirements.txt
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Audit published comparison measurements
        run: python3 -m experiments audit
      - name: Rebuild the published request cohort
        run: |
          mkdir -p build/cohort
          curl --fail --location --retry 2 \
            https://raw.githubusercontent.com/kvcache-ai/Mooncake/3cca71daccf2a7afb8fe3f0295358f70e3a69fdb/FAST25-release/traces/toolagent_trace.jsonl \
            --output build/cohort/toolagent_trace.jsonl
          python3 -m experiments rebuild-cohort \
            --trace build/cohort/toolagent_trace.jsonl --output build/cohort/plan.json
      - name: Build report
        run: python3 report/build.py
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload report
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
